{% extends 'base.html' %}
{% block title %}Parol muvaffaqiyatli o'zgartirildi{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card text-center">
            <div class="d-inline-flex p-4 rounded-circle bg-success-subtle text-success mb-3">
                <i class="bi bi-shield-check fs-1"></i>
            </div>
            <h2 class="fw-bold mb-2">Parol o'zgartirildi!</h2>
            <p class="text-muted mb-4">Yangi parolingiz muvaffaqiyatli saqlandi. Xavfsizlikni ta'minlash uchun bu parolni hech kimga bermang.</p>
            <a href="{% url 'profile' username=request.user.username %}" class="btn btn-primary">
                <i class="bi bi-person-circle me-1"></i> Profilga qaytish
            </a>
        </div>
    </div>
</div>
{% endblock %}
